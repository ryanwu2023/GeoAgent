apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: geoagent
  labels:
    cloud.sealos.io/app-deploy-manager: geoagent
    cloud.sealos.io/app-deploy-manager-domain: geoagentd40d
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: geoagentd40d.sealosgzg.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: geoagent
                port:
                  number: 8000
  tls:
    - hosts:
        - geoagentd40d.sealosgzg.site
      secretName: wildcard-cert
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geoagent-web-access
  labels:
    cloud.sealos.io/app-deploy-manager: geoagent
spec:
  podSelector:
    matchLabels:
      app: geoagent
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
