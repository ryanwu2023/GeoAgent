server {
    listen 8080;
    server_name _;
    client_max_body_size 10m;
    # Browser sessions are checked by the backend; MCP keeps Bearer authentication.
    location = /mcp {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-GeoAgent-Gateway-User "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /api/integrations {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-GeoAgent-Gateway-User "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Model draft checks may legitimately exceed nginx's 60s default.
        # Keep the authenticated integration path aligned with other APIs.
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-GeoAgent-Gateway-User "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
